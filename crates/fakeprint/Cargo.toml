[package]
name = "fakeprint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fake WSD / IPP printer for Windows print-queue testing"
readme = "../../README.md"
keywords = ["printer", "wsd", "ipp", "testing", "windows"]
categories = ["command-line-utilities", "development-tools::testing"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
quick-xml = "0.37"
futures-util = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tower-http = { version = "0.6", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Tray shell (WP-T, section 5.1): Windows only and only with `--features tray`; nothing here is
# compiled in the default build.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.19", default-features = false, optional = true }
native-windows-gui = { version = "1.0", default-features = false, features = ["menu", "tray-notification", "message-window", "notice"], optional = true }

[features]
default = ["ui"]
# Operator web page module (`ui`); no extra dependencies (the page is `include_str!`ed).
ui = []
# Windows tray shell (`tray` module). Off by default in M0; see docs/multi-device.md "M0 status".
tray = ["dep:tray-icon", "dep:native-windows-gui"]

[build-dependencies]
# Windows .ico + VERSIONINFO for fakeprint.exe (build.rs is a no-op elsewhere).
winresource = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
