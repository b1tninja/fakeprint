<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" role="img" aria-label="fakeprint">
  <title>fakeprint</title>
  <desc>Easter egg: panel reads PC LOAD LETTER (Office Space).</desc>
  <defs>
    <style>
      .body { fill: #1a1f26; }
      .face { fill: #2a313c; }
      .paper { fill: #f4f2ea; }
      .line { fill: #1a1f26; }
      .accent { fill: #0d9488; }
      .lcd { fill: #0a1210; }
      .lcd-text { fill: #5eead4; }
      .wordmark { fill: #1a1f26; }
      @media (prefers-color-scheme: dark) {
        .body { fill: #c5cad3; }
        .face { fill: #9aa3b2; }
        .wordmark { fill: #e8eaed; }
        .lcd { fill: #06100e; }
        .lcd-text { fill: #2dd4bf; }
      }
    </style>
  </defs>
  <!-- Paper out (top) -->
  <rect class="paper" x="148" y="88" width="216" height="96" rx="4"/>
  <rect class="line" x="168" y="112" width="140" height="8" rx="2" opacity="0.35"/>
  <rect class="line" x="168" y="132" width="110" height="8" rx="2" opacity="0.25"/>
  <rect class="line" x="168" y="152" width="160" height="8" rx="2" opacity="0.2"/>
  <!-- Printer body -->
  <rect class="body" x="72" y="196" width="368" height="148" rx="14"/>
  <rect class="face" x="96" y="220" width="320" height="72" rx="8"/>
  <!-- Output slot -->
  <rect class="face" x="128" y="188" width="256" height="16" rx="4"/>
  <rect class="accent" x="140" y="192" width="232" height="6" rx="2"/>
  <!-- Accent F on face -->
  <path class="accent" d="M168 238h48v10h-34v12h28v10h-28v18h-14z"/>
  <!-- LCD: PC LOAD LETTER (Office Space) -->
  <rect class="lcd" x="228" y="236" width="148" height="40" rx="4"/>
  <text class="lcd-text" x="302" y="261" text-anchor="middle"
        font-family="ui-monospace, Cascadia Mono, Consolas, monospace"
        font-weight="700" font-size="11" letter-spacing="0.12em">PC LOAD LETTER</text>
  <!-- Status LED (still blinking in our hearts) -->
  <circle class="accent" cx="396" cy="256" r="8"/>
  <!-- Feed tray -->
  <path class="face" d="M112 344 L400 344 L384 392 L128 392 Z"/>
  <rect class="paper" x="148" y="356" width="216" height="24" rx="3" opacity="0.85"/>
  <text class="wordmark" x="256" y="460" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif"
        font-weight="700" font-size="56" letter-spacing="0.06em">fakeprint</text>
</svg>
