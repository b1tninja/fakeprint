<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-label="fakeprint">
  <title>fakeprint</title>
  <desc>Easter egg: PC LOAD LETTER under the wordmark.</desc>
  <defs>
    <style>
      .mark { fill: #115e59; }
      .letters { fill: #ffffff; }
      .wordmark { fill: #1a1f26; }
      .egg { fill: #0d9488; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #e8eaed; }
        .egg { fill: #5eead4; }
      }
    </style>
  </defs>
  <rect class="mark" x="8" y="20" width="180" height="180" rx="40"/>
  <text class="letters" x="98" y="148" text-anchor="middle"
        font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif"
        font-weight="700" font-size="96" letter-spacing="-0.04em">Fp</text>
  <text class="wordmark" x="220" y="120"
        font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif"
        font-weight="700" font-size="72" letter-spacing="0.02em">fakeprint</text>
  <text class="egg" x="222" y="168"
        font-family="ui-monospace, Cascadia Mono, Consolas, monospace"
        font-weight="700" font-size="18" letter-spacing="0.14em">PC LOAD LETTER</text>
</svg>
