[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakeprint"
version = "0.1.0"
description = "Python control-plane client for fakeprint (lab harness; optional)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.0"]

[project.scripts]
fakeprint-lab = "fakeprint.lab:main"
fakeprint-mcp = "fakeprint.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fakeprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs a running fakeprint on FAKEPRINT_BASE_URL (default http://127.0.0.1:3921)",
]
